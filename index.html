<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catatan Utang</title>
<meta name="theme-color" content="#0a84ff">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Catatan Utang">
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1d2330;--mut:#6b7280;--pri:#0a84ff;--red:#d90f0f;--grn:#1fb98a;--ln:#e6e8ec;--chip:#e8e9ec;--av:#6cb4ff;--yel:#f8b400;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151b;--card:#1c2029;--tx:#eef0f4;--mut:#9aa1ae;--ln:#2b303b;--chip:#2a2f3a}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Roboto,sans-serif;max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:90px}
header{background:var(--pri);color:#fff;padding:16px;display:flex;align-items:center;gap:12px;font-weight:600;font-size:18px}
header .sp{flex:1}.pill{background:#fff;color:var(--pri);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:500;display:flex;gap:8px;align-items:center}
.pill b{background:var(--red);color:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:12px}
.sum{margin:14px;background:var(--card);border-radius:12px;box-shadow:0 2px 8px #0002;display:grid;grid-template-columns:1fr 1fr;text-align:center}
.sum div{padding:14px 8px}.sum div+div{border-left:1px solid var(--ln)}.sum small{font-size:13px}.sum p{margin:4px 0 0;font-size:22px;font-weight:700}
.g{color:var(--grn)}.r{color:var(--red)}
.search{padding:0 14px 8px}input,select{width:100%;padding:12px;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 14px 12px}.chip{white-space:nowrap;border:0;border-radius:20px;padding:10px 16px;background:var(--chip);color:var(--pri);font:inherit}.chip.on{background:var(--pri);color:#fff;font-weight:600}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--ln);cursor:pointer}
.av{width:44px;height:44px;border-radius:50%;background:var(--av);color:#fff;display:grid;place-items:center;font-size:20px;flex:none}
.nm{flex:1;font-size:17px}.am{text-align:right;font-weight:600;font-size:17px}.am small{display:block;font-weight:400;font-size:12px;color:var(--mut)}
.late{font-size:11px;color:var(--red);display:block}
.fab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:max(16px,calc(50% - 224px));background:var(--yel);color:#222;border:0;border-radius:30px;padding:16px 24px;font-weight:700;letter-spacing:1px;box-shadow:0 4px 10px #0004;font-size:14px}
.empty{text-align:center;color:var(--mut);padding:40px}
.dh{background:var(--pri);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}.dh button{background:none;border:0;color:#fff;font-size:24px}
.big{background:var(--card);margin:14px;border-radius:12px;padding:16px;text-align:center;box-shadow:0 2px 8px #0002}.big p{font-size:28px;font-weight:700;margin:4px 0}
.acts{display:flex;gap:10px;margin:0 14px 12px}.acts button,.btn{flex:1;border:0;border-radius:10px;padding:13px;font:inherit;font-weight:600;color:#fff}
.tx{display:flex;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--ln)}.tx small{color:var(--mut);display:block}
.mask{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
.sheet h3{margin:0}.seg{display:flex;gap:8px}.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit}.seg .on{background:var(--pri);color:#fff;border-color:var(--pri)}
label{font-size:13px;color:var(--mut)}.del{background:none;border:0;color:var(--red);padding:10px;font:inherit}
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--ln)}.tabs button{flex:1;padding:14px 2px;border:0;background:none;color:var(--mut);font:inherit;font-size:13px;font-weight:600;border-bottom:3px solid transparent}.tabs .on{color:var(--pri);border-bottom-color:var(--pri)}
</style></head><body>
<div id="app"></div>
<script>
const KEY='catatan-utang-v1';
const day=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const today=day(0);
let S={biz:'Toko Saya',c:[]};
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r);else throw 0}catch(e){
S.c=[]}
S.loans=S.loans||[];S.sv=S.sv||[];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(window.cloudSave)cloudSave()};
const itm=c=>0;
const rp=n=>'Rp'+Math.abs(n).toLocaleString('id-ID');
const bal=c=>c.tx.reduce((s,x)=>s+(x.t==='u'?x.a:-x.a),0);
const dueState=c=>{if(bal(c)<=0)return '';const ds=c.tx.filter(x=>x.t==='u'&&x.due).map(x=>x.due).sort();if(!ds.length)return '';return ds[0]<today?'late':ds[0]===today?'today':''};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
let view='list',filter='all',q='',cur=null,tab='debt',lsq='',lf='out',lcur=null,scur=null,so='new',mv='menu';
const tabbar=()=>`<div class="tabs"><button class="${tab==='debt'?'on':''}" onclick="tab='debt';view='list';render()">Utang</button><button class="${tab==='loan'?'on':''}" onclick="tab='loan';lcur=null;render()">Pinjam Barang</button><button class="${tab==='sv'?'on':''}" onclick="tab='sv';scur=null;render()">Tabungan</button><button class="${tab==='more'?'on':''}" onclick="tab='more';mv='menu';render()">Lainnya</button></div>`;
const chips=[['all','Semua'],['owe','Utang Pelanggan'],['paid','Lunas']];
function render(){const el=document.getElementById('app');el.innerHTML=tab==='more'?more():tab==='sv'?(scur?svDetail():tabbar()+svList()):tab==='loan'?(lcur?loanDetail():tabbar()+loansG()):view==='list'?tabbar()+list():detail()}
function list(){
 const bs=S.c.map(bal);const up=bs.filter(b=>b>0).reduce((a,b)=>a+b,0),us=-bs.filter(b=>b<0).reduce((a,b)=>a+b,0);
 
 let cs=S.c.filter(c=>c.name.toLowerCase().includes(q.toLowerCase())).filter(c=>{const b=bal(c);return filter==='all'||(filter==='owe'&&b>0)||(filter==='paid'&&b===0)});cs=sortC(cs);
 return `<header><span class="sp">${esc(S.biz)}</span></header>
 <div class="sum"><div><small>Utang Saya</small><p class="g">${rp(us)}</p></div><div><small>Utang Pelanggan</small><p class="r">${rp(up)}</p></div></div>
 <div class="search"><input placeholder="Cari ${S.c.length} pelanggan" value="${esc(q)}" oninput="q=this.value;render();const i=document.querySelector('.search input');i.focus();i.setSelectionRange(q.length,q.length)"></div>
 <div class="chips">${chips.map(([k,l])=>`<button class="chip ${filter===k?'on':''}" onclick="filter='${k}';render()">${l}</button>`).join('')}</div>
 <div class="search" style="padding-top:0"><select onchange="so=this.value;render()"><option value="new" ${so==='new'?'selected':''}>Urutkan: Terbaru</option><option value="big" ${so==='big'?'selected':''}>Urutkan: Utang terbesar</option><option value="az" ${so==='az'?'selected':''}>Urutkan: Nama A–Z</option></select></div>
 ${cs.length?cs.map(c=>{const b=bal(c);return `<div class="row" onclick="cur=${c.id};view='detail';render()"><div class="av">${esc(c.name[0]||'?').toUpperCase()}</div><div class="nm">${esc(c.name)}</div><div class="am ${b>0?'r':'g'}">${b>0?rp(b):b<0?rp(b):'Rp 0'}<small>${b>0?'Utang Pelanggan':b<0?'Utang Saya':'Lunas'}</small>${itm(c)>0?`<small style="color:var(--pri)">Pinjam ${itm(c)} barang</small>`:''}</div></div>`}).join(''):'<div class="empty">Belum ada data</div>'}
 <button class="fab" onclick="sheet()">+ CATAT UTANG</button>`}
function detail(){const c=S.c.find(x=>x.id===cur);if(!c){view='list';return list()}const b=bal(c);
 return `<div class="dh"><button onclick="view='list';render()">←</button><span style="font-size:18px;font-weight:600">${esc(c.name)}</span></div>
 <div class="big"><small>${b>0?'Utang Pelanggan':b<0?'Utang Saya':'Lunas'}</small><p class="${b>0?'r':'g'}">${rp(b)}</p>${itm(c)>0?`<small style="color:var(--pri)">Pinjam ${itm(c)} barang</small>`:''}</div>
 <div class="acts"><button style="background:var(--red)" onclick="sheet(${c.id},'u')">Beri Utang</button><button style="background:var(--grn)" onclick="sheet(${c.id},'b')">Terima Bayar</button></div>
 ${c.tx.map((x,i)=>({x,i})).reverse().map(({x,i})=>`<div class="tx" style="cursor:pointer" onclick="editTx(${c.id},${i})"><div>${x.a?(x.t==='u'?'Utang':'Pembayaran'):'Catatan'}${x.n?' · '+esc(x.n):''}${x.q?' · '+x.q+' barang':''}<small>${x.d}</small></div><b class="${x.t==='u'?'r':'g'}">${x.a?(x.t==='u'?'+':'−')+rp(x.a):''}</b></div>`).join('')||'<div class="empty">Belum ada transaksi</div>'}
 <div style="text-align:center"><button class="del" onclick="ask('Hapus pelanggan ini?',()=>{S.c=S.c.filter(x=>x.id!==${c.id});save();view='list';render()})">Hapus pelanggan</button></div>`}
function sheet(id,t){
 const m=document.createElement('div');m.className='mask';
 m.innerHTML=`<div class="sheet"><h3>Catat Utang</h3>
 ${id?'':'<label>Pelanggan</label><select id="sc">'+S.c.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')+'<option value="new">+ Pelanggan baru</option></select><input id="nn" placeholder="Nama pelanggan baru" style="display:none">'}
 <div class="seg"><button id="bu" class="on">Beri Utang</button><button id="bb">Terima Bayar</button></div>
 <label>Jumlah (Rp)</label><input id="am" type="number" inputmode="numeric" placeholder="0">
 <label>Catatan</label><input id="no" placeholder="Opsional">
 <label>Tanggal</label><input id="dt" type="date" value="${today}">
 <div style="display:flex;gap:8px"><button class="btn" style="background:var(--mut)" id="cx">Batal</button><button class="btn" style="background:var(--pri)" id="ok">Simpan</button></div></div>`;
 document.body.appendChild(m);const $=i=>m.querySelector('#'+i);let ty=t||'u';
 const sync=()=>{$('bu').className=ty==='u'?'on':'';$('bb').className=ty==='b'?'on':''};sync();
 $('bu').onclick=()=>{ty='u';sync()};$('bb').onclick=()=>{ty='b';sync()};
 if(!id){const f=()=>{$('nn').style.display=($('sc').value==='new'||!S.c.length)?'block':'none'};if(!S.c.length)$('sc').value='new';$('sc').onchange=f;f()}
 $('cx').onclick=()=>m.remove();m.onclick=e=>{if(e.target===m)m.remove()};
 $('ok').onclick=()=>{const a=parseInt($('am').value);if(a<0||(!a&&!$('no').value.trim()))return alert('Isi jumlah atau catatan');
  let c;if(id)c=S.c.find(x=>x.id===id);else if($('sc').value==='new'){const n=$('nn').value.trim();if(!n)return alert('Isi nama');c={id:Date.now(),name:n,tx:[]};S.c.unshift(c)}else c=S.c.find(x=>x.id==$('sc').value);
  c.tx.push({t:ty,a:a||0,n:$('no').value.trim(),d:$('dt').value||today});save();m.remove();render()}}
function loans(){
 const L=S.loans,sm=a=>a.reduce((s,l)=>s+l.qty,0),out=L.filter(l=>!l.back);
 const ls=L.filter(l=>(l.person+' '+l.item).toLowerCase().includes(lsq.toLowerCase())).filter(l=>lf==='all'||(lf==='out'&&!l.back)||(lf==='back'&&l.back));
 return `<header><span class="sp">Pinjam Barang</span></header>
 <div class="sum"><div><small>Belum Kembali</small><p class="r">${sm(out)}</p></div><div><small>Sudah Kembali</small><p class="g">${sm(L.filter(l=>l.back))}</p></div></div>
 <div class="search"><input placeholder="Cari peminjam / barang" value="${esc(lsq)}" oninput="lsq=this.value;render();const i=document.querySelector('.search input');i.focus();i.setSelectionRange(lsq.length,lsq.length)"></div>
 <div class="chips">${[['out','Belum Kembali'],['back','Sudah Kembali'],['all','Semua']].map(([k,l])=>`<button class="chip ${lf===k?'on':''}" onclick="lf='${k}';render()">${l}</button>`).join('')}</div>
 ${ls.length?ls.slice().reverse().map(l=>`<div class="row" onclick="loanSheet(${l.id})"><div class="av">${esc(l.person[0]||'?').toUpperCase()}</div><div class="nm">${esc(l.person)}<small style="display:block;color:var(--mut);font-size:13px">${esc(l.item)} · ${l.qty} pcs · ${l.date}</small></div><div class="am ${l.back?'g':'r'}">${l.back?'Kembali':'Belum'}<small>${l.back?l.bd:'kembali'}</small></div></div>`).join(''):'<div class="empty">Belum ada data pinjaman barang</div>'}
 <button class="fab" onclick="loanSheet()">+ PINJAM BARANG</button>`}
function loanSheet(id,pp){
 const l=id?S.loans.find(x=>x.id===id):null;
 const names=[...new Set(S.loans.map(x=>x.person).concat(S.c.map(c=>c.name)))];
 const m=document.createElement('div');m.className='mask';
 m.innerHTML=`<div class="sheet"><h3>${l?'Edit Pinjaman':'Pinjam Barang'}</h3>
 <label>Nama peminjam</label><input id="lp" list="pn" value="${l?esc(l.person):esc(pp||'')}"><datalist id="pn">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
 <label>Nama barang</label><input id="li" value="${l?esc(l.item):''}">
 <label>Jumlah</label><input id="lqty" type="number" inputmode="numeric" value="${l?l.qty:1}">
 <label>Tanggal pinjam</label><input id="ld" type="date" value="${l?l.date:today}">
 <div style="display:flex;gap:8px"><button class="btn" style="background:var(--mut)" id="cx">Batal</button><button class="btn" style="background:var(--pri)" id="ok">Simpan</button></div>
 ${l?`<button class="btn" style="background:var(--grn)" id="bk">${l.back?'Tandai belum kembali':'Tandai sudah kembali'}</button><button class="del" id="dl">Hapus</button>`:''}</div>`;
 document.body.appendChild(m);const $=k=>m.querySelector('#'+k);
 $('cx').onclick=()=>m.remove();m.onclick=e=>{if(e.target===m)m.remove()};
 $('ok').onclick=()=>{const person=$('lp').value.trim(),item=$('li').value.trim(),qty=parseInt($('lqty').value)||1,date=$('ld').value||today;
  if(!person||!item)return alert('Isi nama peminjam dan barang');
  if(l)Object.assign(l,{person,item,qty,date});else S.loans.push({id:Date.now(),person,item,qty,date,back:false,bd:''});
  save();m.remove();render()};
 if(l){$('bk').onclick=()=>{l.back=!l.back;l.bd=l.back?today:'';save();m.remove();render()};
  $('dl').onclick=()=>ask('Hapus data ini?',()=>{S.loans=S.loans.filter(x=>x.id!==l.id);save();m.remove();render()})}
}
const enc=p=>encodeURIComponent(p).replace(/'/g,'%27');
function loansG(){
 const L=S.loans,sm=a=>a.reduce((s,l)=>s+l.qty,0),g={};
 L.forEach(l=>{(g[l.person]=g[l.person]||[]).push(l)});
 const ps=Object.keys(g).filter(p=>(p+' '+g[p].map(l=>l.item).join(' ')).toLowerCase().includes(lsq.toLowerCase())).filter(p=>{const o=g[p].some(l=>!l.back);return lf==='all'||(lf==='out'&&o)||(lf==='back'&&!o)});
 return `<header><span class="sp">Pinjam Barang</span></header>
 <div class="sum"><div><small>Belum Kembali</small><p class="r">${sm(L.filter(l=>!l.back))}</p></div><div><small>Sudah Kembali</small><p class="g">${sm(L.filter(l=>l.back))}</p></div></div>
 <div class="search"><input placeholder="Cari peminjam / barang" value="${esc(lsq)}" oninput="lsq=this.value;render();const i=document.querySelector('.search input');i.focus();i.setSelectionRange(lsq.length,lsq.length)"></div>
 <div class="chips">${[['out','Belum Kembali'],['back','Sudah Kembali'],['all','Semua']].map(([k,l])=>`<button class="chip ${lf===k?'on':''}" onclick="lf='${k}';render()">${l}</button>`).join('')}</div>
 ${ps.length?ps.map(p=>{const out=g[p].filter(l=>!l.back);return `<div class="row" onclick="lcur=decodeURIComponent('${enc(p)}');render()"><div class="av">${esc(p[0]||'?').toUpperCase()}</div><div class="nm">${esc(p)}<small style="display:block;color:var(--mut);font-size:13px">${g[p].length} jenis barang dipinjam</small></div><div class="am ${out.length?'r':'g'}">${out.length?out.length+' belum':'Semua'}<small>${out.length?'dikembalikan':'kembali'}</small></div></div>`}).join(''):'<div class="empty">Belum ada data pinjaman barang</div>'}
 <button class="fab" onclick="loanSheet()">+ PINJAM BARANG</button>`}
function loanDetail(){
 const p=lcur,L=S.loans.filter(l=>l.person===p),out=L.filter(l=>!l.back);
 if(!L.length){lcur=null;return tabbar()+loansG()}
 const sorted=L.filter(l=>!l.back).concat(L.filter(l=>l.back));
 return `<div class="dh"><button onclick="lcur=null;render()">←</button><span style="font-size:18px;font-weight:600">${esc(p)}</span></div>
 <div class="big"><small>Belum dikembalikan</small><p class="${out.length?'r':'g'}">${out.length} jenis · ${out.reduce((s,l)=>s+l.qty,0)} pcs</p></div>
 <div class="acts"><button style="background:var(--pri)" onclick="loanSheet(0,decodeURIComponent('${enc(p)}'))">+ Tambah Barang</button>${out.length?`<button style="background:var(--grn)" onclick="allBack()">Kembalikan Semua</button>`:''}</div>
 ${sorted.map(l=>`<div class="tx"><div>${esc(l.item)} · ${l.qty} pcs<small>Dipinjam ${l.date}${l.back?' · kembali '+l.bd:''}</small></div><div style="display:flex;gap:8px;align-items:center">${l.back?'<b class="g">Kembali</b>':`<button class="chip on" style="background:var(--grn);padding:8px 12px" onclick="retLoan(${l.id})">Sudah dikembalikan</button>`}<button class="chip" style="padding:8px 12px" onclick="loanSheet(${l.id})">✎</button></div></div>`).join('')}`}
function retLoan(id){const l=S.loans.find(x=>x.id===id);if(l){l.back=true;l.bd=today;save();render()}}
function allBack(){ask('Tandai semua barang sudah dikembalikan?',()=>{S.loans.forEach(l=>{if(l.person===lcur&&!l.back){l.back=true;l.bd=today}});save();render()})}
const alloc=a=>a.al.reduce((s,x)=>s+x.amt,0),rs=n=>(n<0?'-':'')+rp(n);
function svList(){
 const tot=S.sv.reduce((s,a)=>s+a.total,0),al=S.sv.reduce((s,a)=>s+alloc(a),0);
 return `<header><span class="sp">Tabungan</span></header>
 <div class="sum"><div><small>Total Tabungan</small><p class="g">${rp(tot)}</p></div><div><small>Sudah Dialokasikan</small><p>${rp(al)}</p></div></div>
 ${S.sv.length?S.sv.map(a=>{const r=a.total-alloc(a);return `<div class="row" onclick="scur=${a.id};render()"><div class="av">🏦</div><div class="nm">${esc(a.name)}<small style="display:block;color:var(--mut);font-size:13px">${a.al.length} pemilik · sisa ${rs(r)}</small></div><div class="am g">${rp(a.total)}</div></div>`}).join(''):'<div class="empty">Belum ada tabungan</div>'}
 <button class="fab" onclick="svSheet()">+ TABUNGAN</button>`}
function svDetail(){
 const a=S.sv.find(x=>x.id===scur);if(!a){scur=null;return tabbar()+svList()}
 const r=a.total-alloc(a);
 return `<div class="dh"><button onclick="scur=null;render()">←</button><span style="font-size:18px;font-weight:600">${esc(a.name)}</span></div>
 <div class="big"><small>Total tabungan</small><p class="g">${rp(a.total)}</p><small>Dialokasikan ${rp(alloc(a))} · <b class="${r<0?'r':''}">Sisa ${rs(r)}</b></small></div>
 <div class="acts"><button style="background:var(--pri)" onclick="alSheet(${a.id})">+ Tambah Pemilik</button><button style="background:var(--mut)" onclick="svSheet(${a.id})">Edit Tabungan</button></div>
 ${a.al.map(x=>`<div class="tx" style="cursor:pointer" onclick="alSheet(${a.id},${x.id})"><div>${esc(x.who)}<small>${esc(x.note||'')}</small></div><b>${rp(x.amt)}</b></div>`).join('')||'<div class="empty">Belum ada pemilik dana</div>'}`}
function svSheet(id){
 const a=id?S.sv.find(x=>x.id===id):null;
 const m=document.createElement('div');m.className='mask';

      if(p.t)coin(p.s,p.fl);else note(p.s,p.fl);cx.restore()}
    if(!reduce)requestAnimationFrame(loop)
  };
  loop(performance.now());
}
if(!firebaseConfig.apiKey||firebaseConfig.apiKey==="ISI"){
  const m=overlay('<h3>Firebase belum diisi</h3><div>Isi <b>firebaseConfig</b> di index.html, atau lanjut dulu tanpa cloud (data hanya di perangkat ini).</div><button class="btn" style="background:var(--pri)" id="go">Lanjut tanpa cloud</button>');
  m.querySelector('#go').onclick=()=>{close();say('Mode lokal')};
}else{
  const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),ref=doc(db,"ledgers","main");
  let unsub=null,timer=null,on=false;
  window.cloudSave=()=>{if(!on)return;say('\u2601 Menyimpan\u2026');clearTimeout(timer);timer=setTimeout(()=>{setDoc(ref,{json:JSON.stringify(getS()),t:Date.now()}).then(()=>say('\u2601 Tersinkron')).catch(e=>say('\u26a0 Gagal sync: '+e.code))},400)};
  window.cloud={out:()=>signOut(auth),email:()=>auth.currentUser&&auth.currentUser.email};
  onAuthStateChanged(auth,u=>{
    if(unsub){unsub();unsub=null}on=false;
    if(!u){say('Belum masuk');loginScreen(auth);return}
    close();on=true;say('\u2601 Menghubungkan\u2026');
    unsub=onSnapshot(ref,snap=>{
      if(snap.metadata.hasPendingWrites)return;
      if(snap.exists()){try{setS(JSON.parse(snap.data().json));say('\u2601 Tersinkron')}catch(e){say('\u26a0 Data rusak')}}
      else{setDoc(ref,{json:JSON.stringify(getS()),t:Date.now()}).then(()=>say('\u2601 Tersinkron'))}
    },err=>{say('\u26a0 '+err.code);if(err.code==='permission-denied')alert('Akun ini tidak punya izin. Cek daftar email di firestore.rules')});
  });
}
</script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
